  <title>Hop Box</title>
  <meta name="description" content="Maintiens appuyé pour sauter de plateforme en plateforme." data-i18n-content="web.description">
  <meta name="theme-color" content="#FDE2C8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
  <canvas id="game" aria-label="Hop Box, jeu de saut" data-i18n-label="web.canvas_label"></canvas>
  <div id="safe-probe"></div>

  <div id="pseudo-dialog" role="dialog" aria-modal="true" aria-labelledby="pseudo-title">
    <form id="pseudo-form" class="card">
      <h2 id="pseudo-title"></h2>
      <p id="pseudo-msg"></p>
      <input id="pseudo-input" maxlength="16" autocomplete="nickname" autocapitalize="off" spellcheck="false" data-i18n-placeholder="pseudo.hint">
      <div class="actions">
        <button type="button" id="pseudo-cancel" class="secondary" data-i18n="common.cancel">Annuler</button>
        <button type="submit">OK</button>
      </div>
    </form>
  </div>

  <div id="text-dialog" role="dialog" aria-modal="true" aria-labelledby="text-title">
    <form id="text-form" class="card">
      <h2 id="text-title"></h2>
      <p id="text-msg"></p>
      <input id="text-input" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="actions">
        <button type="button" id="text-cancel" class="secondary" data-i18n="common.cancel">Annuler</button>
        <button type="submit" id="text-ok">OK</button>
      </div>
    </form>
  </div>

  <div id="error-box">
    <div class="card">
      <h2 data-i18n="web.error_title">Oups, un problème</h2>
      <p data-i18n="web.error_msg">Fais une capture d'écran de ce message et envoie-la pour que le bug soit corrigé.</p>
      <pre id="error-text"></pre>
      <div class="actions"><button type="button" onclick="location.reload()" data-i18n="web.reload">Recharger</button></div>
    </div>
  </div>
